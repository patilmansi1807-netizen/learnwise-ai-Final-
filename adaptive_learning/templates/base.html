<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdeptLearn | Adaptive Cognitive Engine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-badge">Δ</span>
                <span class="logo-title">Adept<strong>Learn</strong></span>
            </div>
            <nav class="nav-links">
                <a href="{{ url_for('student_dashboard') }}" class="nav-item">Dashboard</a>
                <a href="{{ url_for('practice') }}" class="nav-item">Adaptive Practice</a>
                <a href="{{ url_for('concept_map') }}" class="nav-item">Concept Graph</a>
                <a href="{{ url_for('code_lab') }}" class="nav-item">Code Sandbox</a>
                <a href="{{ url_for('session_replay') }}" class="nav-item">Session Replay</a>
                <a href="{{ url_for('teacher_dashboard') }}" class="nav-item teacher-link">Trainer View</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
